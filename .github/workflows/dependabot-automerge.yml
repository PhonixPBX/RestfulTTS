name: dependabot-automerge

# Enables GitHub's auto-merge (squash) on Dependabot PRs whose updates are all semver patches; GitHub merges
# once the required checks of the main ruleset (lint-test, shell, vendor, image) have passed. Minor and major
# updates stay open for review. The PR code is never checked out.
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # for grouped PRs update-type is the highest change of all dependencies in it
      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
