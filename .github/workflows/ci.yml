name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: uv run pytest -q

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh -S warning scripts/*.sh

  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: vendored front-end assets match vendor/VERSIONS
        run: cd src/restfultts/static/vendor && sed -n 's/^\([0-9a-f]\{64\}\)  /\1  /p' VERSIONS | sha256sum -c --quiet
