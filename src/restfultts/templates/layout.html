<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"defaultTimeout": 300000}'>
  <title>{% block title %}RestfulTTS{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="/static/vendor/icons/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/tabler/tabler-theme.min.js"></script>
  <script src="/static/vendor/htmx/htmx.min.js" defer></script>
  <script src="/static/vendor/tabler/tabler.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="page">
  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <a class="navbar-brand" href="/"><i class="ti ti-speakerphone me-2" aria-hidden="true"></i>RestfulTTS</a>
      <div class="navbar-nav flex-row order-md-last gap-2">
        <a class="btn btn-ghost-secondary" href="/docs" title="REST API (OpenAPI)"><i class="ti ti-code me-1" aria-hidden="true"></i>API</a>
        {% if auth_enabled and csrf_token %}
        <form method="post" action="/logout"><button class="btn btn-ghost-secondary" type="submit"><i class="ti ti-logout me-1" aria-hidden="true"></i>Abmelden</button></form>
        {% endif %}
      </div>
    </div>
  </header>
  <div class="page-wrapper">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
