{% if history %}
<div class="list-group list-group-flush">
  {% for h in history %}
  <div class="list-group-item">
    <div class="text-truncate" title="{{ h.text }}">{{ h.text }}</div>
    <div class="d-flex align-items-center gap-2 mt-1">
      <span class="badge bg-secondary-lt">{{ h.language }}</span>
      <span class="text-secondary small">{{ h.voice }}{% if h.speed != 1.0 %} · {{ h.speed }}×{% endif %}{% if h.duration %} · {{ "%.1f"|format(h.duration) }} s{% endif %}</span>
      <button class="btn btn-sm btn-ghost-danger btn-icon ms-auto" type="button" title="Löschen" aria-label="Löschen"
              hx-delete="/ui/audio/{{ h.key }}" hx-target="#history" hx-confirm="Diese Ansage in allen Formaten löschen?">
        <i class="ti ti-trash" aria-hidden="true"></i>
      </button>
    </div>
    <audio class="w-100 mt-1" controls preload="none" src="/api/v1/audio/{{ h.key }}.{{ h.ext }}"></audio>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="card-body text-secondary">Noch nichts erzeugt.</div>
{% endif %}
